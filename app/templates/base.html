<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aadarsh Global{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e2e8f0; min-height: 100vh; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f0f1a;
            --card: #1a1a2e;
            --card2: #16213e;
            --border: rgba(99,102,241,0.15);
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
            background: var(--card); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 100;
            padding: 0 0 20px 0;
        }
        .sidebar-brand {
            padding: 24px 20px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .sidebar-brand .logo {
            width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px;
        }
        .sidebar-brand .brand-name { font-size: 16px; font-weight: 700; color: #fff; }
        .sidebar-brand .brand-sub { font-size: 11px; color: var(--muted); }
        .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .nav-section-title { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase;
            letter-spacing: 1px; padding: 8px 8px 4px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            border-radius: 8px; color: var(--muted); text-decoration: none;
            font-size: 14px; font-weight: 500; transition: all 0.2s; margin-bottom: 2px;
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(99,102,241,0.15); color: var(--primary);
        }
        .nav-item i { width: 18px; text-align: center; font-size: 15px; }
        .sidebar-user {
            margin: 0 12px; padding: 12px; background: var(--card2);
            border-radius: 10px; border: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .user-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; color: #fff;
        }
        .user-name { font-size: 13px; font-weight: 600; color: var(--text); }
        .user-role { font-size: 11px; color: var(--muted); }
        .main-content { margin-left: 260px; min-height: 100vh; }
        .topbar {
            position: sticky; top: 0; background: rgba(15,15,26,0.9);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            padding: 14px 28px; display: flex; align-items: center;
            justify-content: space-between; z-index: 90;
        }
        .topbar-title { font-size: 18px; font-weight: 700; color: #fff; }
        .topbar-actions { display: flex; align-items: center; gap: 14px; }
        .notif-btn {
            position: relative; width: 38px; height: 38px; border-radius: 10px;
            background: var(--card); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--muted); cursor: pointer; transition: all 0.2s;
        }
        .notif-btn:hover { color: var(--primary); border-color: var(--primary); }
        .notif-badge {
            position: absolute; top: -4px; right: -4px;
            background: var(--danger); color: #fff; font-size: 9px;
            font-weight: 700; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .page-content { padding: 28px; }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px;
        }
        .card-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 16px; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.15); }
        .stat-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px;
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #fff; }
        .stat-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .grid { display: grid; gap: 20px; }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; border: none; transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline {
            background: transparent; color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .badge {
            display: inline-flex; align-items: center; padding: 3px 10px;
            border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .badge-pending { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge-in_progress { background: rgba(99,102,241,0.15); color: var(--primary); }
        .badge-completed { background: rgba(16,185,129,0.15); color: var(--success); }
        .badge-cancelled { background: rgba(239,68,68,0.15); color: var(--danger); }
        .badge-high { background: rgba(239,68,68,0.15); color: var(--danger); }
        .badge-medium { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge-low { background: rgba(16,185,129,0.15); color: var(--success); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 14px;
            border-bottom: 1px solid var(--border); }
        td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid rgba(99,102,241,0.05); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(99,102,241,0.04); }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted);
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control {
            width: 100%; padding: 10px 14px; background: var(--bg);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .form-control:focus { border-color: var(--primary); }
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 28px; width: 100%; max-width: 500px;
            max-height: 90vh; overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 20px; }
        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 14px 18px; min-width: 280px;
            display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.info { border-left: 4px solid var(--primary); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 48px; color: var(--muted); margin-bottom: 16px; display: block; }
        .empty-state p { color: var(--muted); font-size: 15px; }
        select.form-control option { background: var(--card); }
        .logout-btn {
            width: 100%; margin: 0 12px; padding: 10px;
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px; color: var(--danger); font-size: 13px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: all 0.2s; width: calc(100% - 24px);
        }
        .logout-btn:hover { background: rgba(239,68,68,0.2); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
{% block body %}{% endblock %}
<script>
    const API = '';
    const token = localStorage.getItem('access_token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');

    function showToast(msg, type='info') {
        const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
        const colors = { success: '#10b981', error: '#ef4444', info: '#6366f1' };
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type]}" style="color:${colors[type]}; font-size:18px;"></i><span style="font-size:13px;">${msg}</span>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    async function apiCall(url, method='GET', body=null) {
        const opts = {
            method,
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
        };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API + url, opts);
        return res;
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
