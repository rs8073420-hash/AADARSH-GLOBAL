{% extends "base.html" %}
{% block title %}CRM Pipeline — Aadarsh Global{% endblock %}

{% block extra_css %}
<style>
    .pipeline-container { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 20px; min-height: calc(100vh - 180px); }
    .pipeline-col { min-width: 260px; width: 260px; flex-shrink: 0; display: flex; flex-direction: column; border-radius: 14px; background: var(--card); border: 1px solid var(--border); overflow: hidden; }
    .pipeline-header { padding: 16px; text-align: center; font-size: 13px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between; }
    .pipeline-count { background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; }
    .pipeline-body { flex: 1; padding: 10px; overflow-y: auto; min-height: 100px; transition: background 0.2s; }
    .pipeline-body.drag-over { background: rgba(99,102,241,0.08); }
    .lead-card { background: rgba(26,26,46,0.9); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 8px; cursor: grab; transition: all 0.25s cubic-bezier(.4,0,.2,1); }
    .lead-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.15); }
    .lead-card.dragging { opacity: 0.4; transform: rotate(2deg) scale(0.95); }
    .lead-card-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .lead-card-info { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .lead-card-budget { font-size: 13px; font-weight: 700; color: var(--success); }
    .lead-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .lead-card-avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #fff; }
    .col-new .pipeline-header { background: linear-gradient(135deg, #6366f1, #818cf8); }
    .col-contacted .pipeline-header { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
    .col-interested .pipeline-header { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
    .col-site_visit .pipeline-header { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
    .col-negotiation .pipeline-header { background: linear-gradient(135deg, #ec4899, #f472b6); }
    .col-closed .pipeline-header { background: linear-gradient(135deg, #10b981, #34d399); }
    .detail-panel { position: fixed; right: -420px; top: 0; bottom: 0; width: 400px; background: var(--card); border-left: 1px solid var(--border); z-index: 200; transition: right 0.35s cubic-bezier(.4,0,.2,1); overflow-y: auto; padding: 28px; box-shadow: -10px 0 40px rgba(0,0,0,0.3); }
    .detail-panel.open { right: 0; }
    .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 199; }
    .detail-overlay.open { display: block; }
    .detail-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .detail-value { font-size: 14px; color: var(--text); margin-bottom: 16px; }
    .skeleton { background: linear-gradient(90deg, var(--card2) 25%, rgba(99,102,241,0.08) 50%, var(--card2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .pipeline-body::-webkit-scrollbar { width: 4px; }
    .pipeline-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
{% endblock %}

{% block body %}
<!-- Sidebar -->
{% include 'components/admin_sidebar.html' %}

<div class="main-content">
    <div class="topbar">
        <div class="topbar-title"><i class="fas fa-stream" style="margin-right:8px; color:var(--primary);"></i> CRM Pipeline</div>
        <div class="topbar-actions">
            <div class="notif-btn" onclick="loadPipeline()"><i class="fas fa-sync-alt"></i></div>
        </div>
    </div>
    <div class="page-content">
        <div class="pipeline-container" id="pipeline">
            <!-- Columns rendered by JS -->
        </div>
    </div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
        <h3 style="font-size:18px; font-weight:700; color:#fff;">Lead Details</h3>
        <button onclick="closeDetail()" style="background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px;"><i class="fas fa-times"></i></button>
    </div>
    <div id="detailContent">
        <div class="skeleton" style="width:100%;height:20px;margin-bottom:12px;"></div>
        <div class="skeleton" style="width:80%;height:20px;margin-bottom:12px;"></div>
        <div class="skeleton" style="width:60%;height:20px;"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (!token) window.location.href = '/login';
    document.getElementById('sidebarName').textContent = user.name || 'Admin';
    document.getElementById('sidebarAvatar').textContent = (user.name || 'A')[0].toUpperCase();

    const statuses = ['New', 'Contacted', 'Interested', 'Site Visit', 'Negotiation', 'Closed'];
    const colClasses = ['col-new', 'col-contacted', 'col-interested', 'col-site_visit', 'col-negotiation', 'col-closed'];
    let allLeads = [];
    let employees = [];

    async function loadEmployees() {
        try {
            const res = await fetch('/api/admin/employees', { headers: { 'Authorization': `Bearer ${token}` }});
            const data = await res.json();
            employees = data.employees || [];
        } catch(e) {}
    }

    function getEmployeeName(id) {
        const emp = employees.find(e => e._id === id);
        return emp ? emp.name : 'Unassigned';
    }

    async function loadPipeline() {
        try {
            const res = await fetch('/api/leads', { headers: { 'Authorization': `Bearer ${token}` }});
            const data = await res.json();
            allLeads = data.leads || [];
            renderPipeline();
        } catch(e) {
            showToast('Failed to load pipeline', 'error');
        }
    }

    function renderPipeline() {
        const container = document.getElementById('pipeline');
        container.innerHTML = statuses.map((status, i) => {
            const leads = allLeads.filter(l => l.status === status);
            return `
            <div class="pipeline-col ${colClasses[i]}">
                <div class="pipeline-header">
                    <span>${status}</span>
                    <span class="pipeline-count">${leads.length}</span>
                </div>
                <div class="pipeline-body" id="col-${status.replace(' ','_')}"
                     ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)"
                     ondrop="handleDrop(event, '${status}')">
                    ${leads.map(l => renderCard(l)).join('')}
                    ${!leads.length ? '<div style="text-align:center; padding:30px 10px; color:var(--muted); font-size:12px;"><i class="fas fa-inbox" style="display:block; font-size:24px; margin-bottom:8px;"></i>No leads</div>' : ''}
                </div>
            </div>`;
        }).join('');
    }

    function renderCard(lead) {
        const emp = getEmployeeName(lead.assigned_to);
        const initial = emp !== 'Unassigned' ? emp[0].toUpperCase() : '?';
        return `
        <div class="lead-card" draggable="true" data-id="${lead._id}"
             ondragstart="handleDragStart(event, '${lead._id}')"
             ondragend="handleDragEnd(event)"
             onclick="openDetail('${lead._id}')">
            <div class="lead-card-name">${lead.name || 'Unknown'}</div>
            <div class="lead-card-info"><i class="fas fa-phone"></i> ${lead.phone || '—'}</div>
            <div class="lead-card-info"><i class="fas fa-map-marker-alt"></i> ${lead.city || '—'}</div>
            ${lead.budget ? `<div class="lead-card-budget">₹ ${lead.budget}</div>` : ''}
            <div class="lead-card-footer">
                <div style="display:flex; align-items:center; gap:6px;">
                    <div class="lead-card-avatar">${initial}</div>
                    <span style="font-size:11px; color:var(--muted);">${emp}</span>
                </div>
                <span style="font-size:10px; color:var(--muted); background:rgba(99,102,241,0.1); padding:2px 8px; border-radius:6px;">${lead.source || '—'}</span>
            </div>
        </div>`;
    }

    // Drag & Drop
    let draggedId = null;

    function handleDragStart(e, id) {
        draggedId = id;
        e.target.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', id);
    }

    function handleDragEnd(e) {
        e.target.classList.remove('dragging');
        document.querySelectorAll('.pipeline-body').forEach(el => el.classList.remove('drag-over'));
    }

    function handleDragOver(e) {
        e.preventDefault();
        e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
        e.currentTarget.classList.remove('drag-over');
    }

    async function handleDrop(e, newStatus) {
        e.preventDefault();
        e.currentTarget.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain') || draggedId;
        if (!id) return;

        const lead = allLeads.find(l => l._id === id);
        if (!lead || lead.status === newStatus) return;

        // Optimistic UI update
        lead.status = newStatus;
        renderPipeline();

        try {
            const res = await fetch(`/api/leads/${id}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            if (res.ok) {
                showToast(`Lead moved to ${newStatus}`, 'success');
            } else {
                showToast('Failed to update status', 'error');
                loadPipeline();
            }
        } catch(e) {
            showToast('Error updating lead', 'error');
            loadPipeline();
        }
        draggedId = null;
    }

    // Detail Panel
    function openDetail(id) {
        const lead = allLeads.find(l => l._id === id);
        if (!lead) return;
        const emp = getEmployeeName(lead.assigned_to);
        const phone = (lead.phone||'').replace(/\D/g, '');

        document.getElementById('detailContent').innerHTML = `
            <div style="text-align:center; margin-bottom:24px;">
                <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;margin:0 auto 12px;">
                    ${(lead.name||'?')[0].toUpperCase()}
                </div>
                <h3 style="font-size:20px;font-weight:700;color:#fff;">${lead.name||'Unknown'}</h3>
                <span class="badge badge-${(lead.status||'new').toLowerCase().replace(' ','_')}" style="margin-top:8px;">${lead.status||'New'}</span>
            </div>
            <div class="detail-label">Phone</div>
            <div class="detail-value">
                ${lead.phone||'—'}
                <a href="https://wa.me/${phone}" target="_blank" style="color:#25d366; margin-left:8px;"><i class="fab fa-whatsapp"></i></a>
                <a href="tel:${lead.phone}" style="color:#3b82f6; margin-left:6px;"><i class="fas fa-phone"></i></a>
            </div>
            <div class="detail-label">Email</div>
            <div class="detail-value">${lead.email||'—'}</div>
            <div class="detail-label">City</div>
            <div class="detail-value">${lead.city||'—'}</div>
            <div class="detail-label">Budget</div>
            <div class="detail-value" style="color:var(--success);font-weight:700;">${lead.budget||'—'}</div>
            <div class="detail-label">Source</div>
            <div class="detail-value">${lead.source||'—'}</div>
            <div class="detail-label">Assigned To</div>
            <div class="detail-value">${emp}</div>
            <div class="detail-label">Notes</div>
            <div class="detail-value" style="white-space:pre-wrap;">${lead.notes||'No notes'}</div>
            <div style="display:flex; gap:8px; margin-top:20px;">
                <a href="/admin/leads" class="btn btn-outline" style="flex:1; justify-content:center;"><i class="fas fa-external-link-alt"></i> Full View</a>
            </div>
        `;
        document.getElementById('detailPanel').classList.add('open');
        document.getElementById('detailOverlay').classList.add('open');
    }

    function closeDetail() {
        document.getElementById('detailPanel').classList.remove('open');
        document.getElementById('detailOverlay').classList.remove('open');
    }

    // Socket.IO
    try {
        const socket = io();
        socket.on('lead_update', () => loadPipeline());
        socket.on('new_lead', () => { loadPipeline(); showToast('New lead added!', 'info'); });
    } catch(e) {}

    // Init
    loadEmployees().then(() => loadPipeline());
</script>
{% endblock %}
