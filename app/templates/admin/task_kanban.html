<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Task Kanban — Richa Global Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Dragula for Drag and Drop -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#6366f1;--accent:#8b5cf6;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--card:#1a1a2e;--card2:#16213e;--border:rgba(99,102,241,0.15);--muted:#94a3b8;--bg:#0f0f1a}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:#e2e8f0;display:flex;height:100vh;overflow:hidden}
        
        /* Sidebar */
        .sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
        .sidebar-brand{padding:22px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
        .logo{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
        .brand-name{font-size:15px;font-weight:700;color:#fff}.brand-sub{font-size:11px;color:var(--muted)}
        .sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
        .nav-section{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px}
        .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;margin-bottom:2px}
        .nav-item:hover,.nav-item.active{background:rgba(99,102,241,.15);color:var(--primary)}
        .nav-item i{width:18px;text-align:center}
        
        .main{flex:1;display:flex;flex-direction:column;min-width:0}
        .topbar{background:rgba(15,15,26,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px}
        .topbar-title{font-size:20px;font-weight:700;color:#fff;flex:1}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none;color:#fff}
        .btn-outline{background:var(--card);border:1px solid var(--border);color:var(--muted)}.btn-outline:hover{color:var(--primary);border-color:var(--primary)}
        
        /* Kanban Board */
        .board-wrapper{flex:1;padding:24px 28px;overflow-x:auto;overflow-y:hidden}
        .kanban-board{display:flex;gap:20px;height:100%;align-items:flex-start}
        .kanban-col{width:320px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;max-height:100%}
        
        .col-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .col-title{font-size:14px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
        .col-count{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:10px}
        
        /* Column colors */
        .col-assigned .col-title i{color:#6366f1}
        .col-in_progress .col-title i{color:#3b82f6}
        .col-under_review .col-title i{color:#f97316}
        .col-approved .col-title i{color:#10b981}
        
        .col-body{padding:16px;overflow-y:auto;flex:1;min-height:150px;display:flex;flex-direction:column;gap:12px}
        
        /* Kanban Card */
        .k-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:grab;position:relative;transition:transform .2s,box-shadow .2s}
        .k-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2);border-color:var(--primary)}
        .k-card.gu-mirror{cursor:grabbing;opacity:.9;transform:rotate(2deg)}
        
        .k-priority{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%}
        .k-priority.high{background:var(--danger);box-shadow:0 0 8px var(--danger)}
        .k-priority.medium{background:var(--warning);box-shadow:0 0 8px var(--warning)}
        .k-priority.low{background:var(--success);box-shadow:0 0 8px var(--success)}
        
        .k-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:6px;padding-right:15px;line-height:1.4}
        .k-id{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-bottom:12px}
        
        .k-meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(99,102,241,.2)}
        .k-due{font-size:11px;font-weight:500;display:flex;align-items:center;gap:5px;color:var(--muted)}
        .k-due.overdue{color:#ef4444}
        
        .k-assignees{display:flex;align-items:center}
        .k-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;border:2px solid var(--card2);margin-left:-8px}
        .k-avatar:first-child{margin-left:0}
        
        .k-stats{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:10px}
        .k-stats i{margin-right:4px}
        
        /* Dragula placeholder */
        .gu-transit{opacity:0.2!important;background:var(--bg)!important;border:1px dashed var(--primary)!important}
        
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
        .toast{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;min-width:280px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slideIn .3s ease}
        .toast.success{border-left:4px solid var(--success)}.toast.error{border-left:4px solid var(--danger)}
        @keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
        
        /* Scrollbar */
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(99,102,241,.3);border-radius:10px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(99,102,241,.6)}
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<nav class="sidebar">
    <div class="sidebar-brand"><div class="logo">R</div><div><div class="brand-name">Richa Global</div><div class="brand-sub">Admin Panel</div></div></div>
    <div class="sidebar-nav">
        <div class="nav-section">Main</div>
        <a href="/admin/dashboard" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
        <a href="/admin/employees" class="nav-item"><i class="fas fa-users"></i> Employees</a>
        <a href="/admin/tasks" class="nav-item active"><i class="fas fa-tasks"></i> Tasks</a>
        <a href="/admin/attendance" class="nav-item"><i class="fas fa-clock"></i> Attendance</a>
    </div>
</nav>

<div class="main">
    <div class="topbar">
        <div class="topbar-title">Kanban Board</div>
        <a href="/admin/tasks" class="btn btn-outline"><i class="fas fa-list"></i> List View</a>
        <a href="/admin/tasks/calendar" class="btn btn-outline"><i class="fas fa-calendar-alt"></i> Calendar</a>
    </div>
    
    <div class="board-wrapper">
        <div class="kanban-board">
            
            <div class="kanban-col col-assigned">
                <div class="col-header">
                    <div class="col-title"><i class="fas fa-clipboard"></i> Assigned</div>
                    <div class="col-count" id="count-assigned">0</div>
                </div>
                <div class="col-body" id="col-assigned" data-status="assigned"></div>
            </div>
            
            <div class="kanban-col col-in_progress">
                <div class="col-header">
                    <div class="col-title"><i class="fas fa-bolt"></i> In Progress</div>
                    <div class="col-count" id="count-in_progress">0</div>
                </div>
                <div class="col-body" id="col-in_progress" data-status="in_progress"></div>
            </div>
            
            <div class="kanban-col col-under_review">
                <div class="col-header">
                    <div class="col-title"><i class="fas fa-eye"></i> Under Review</div>
                    <div class="col-count" id="count-under_review">0</div>
                </div>
                <div class="col-body" id="col-under_review" data-status="under_review"></div>
            </div>
            
            <div class="kanban-col col-approved">
                <div class="col-header">
                    <div class="col-title"><i class="fas fa-check-circle"></i> Approved</div>
                    <div class="col-count" id="count-approved">0</div>
                </div>
                <div class="col-body" id="col-approved" data-status="approved"></div>
            </div>
            
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('access_token');
    if(!token || localStorage.getItem('role') !== 'admin') window.location.href = '/login';

    function showToast(msg, type='info') {
        const c=document.getElementById('toastContainer');const t=document.createElement('div');
        t.className=`toast ${type}`;
        t.innerHTML=`<i class="fas fa-${type==='success'?'check-circle':'times-circle'}" style="color:var(--${type});font-size:18px"></i><span style="font-size:13px">${msg}</span>`;
        c.appendChild(t);setTimeout(()=>t.remove(),3500);
    }
    
    async function api(url,method='GET',body=null){
        const o={method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
        if(body)o.body=JSON.stringify(body);
        return fetch(url,o);
    }

    let drake;

    function renderCards(tasks) {
        const cols = {assigned:[],in_progress:[],under_review:[],approved:[]};
        tasks.forEach(t=>{ if(cols[t.status]) cols[t.status].push(t); });
        
        Object.keys(cols).forEach(status=>{
            const container = document.getElementById(`col-${status}`);
            document.getElementById(`count-${status}`).textContent = cols[status].length;
            
            container.innerHTML = cols[status].map(t=>{
                let dueClass='', dueText='No due date';
                if(t.due_date){
                    const d = new Date(t.due_date);
                    dueText = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
                    if(d < new Date() && t.status!=='approved') dueClass='overdue';
                }
                const msgs = t.comments ? t.comments.length : 0;
                const atts = t.attachments ? t.attachments.length : 0;
                
                return `
                <div class="k-card" data-id="${t._id}" onclick="window.location.href='/admin/tasks/${t._id}'">
                    <div class="k-priority ${t.priority||'medium'}"></div>
                    <div class="k-id">${t.task_id}</div>
                    <div class="k-title">${t.title}</div>
                    <div class="k-stats">
                        <span title="Comments"><i class="fas fa-comment-alt"></i>${msgs}</span>
                        <span title="Attachments"><i class="fas fa-paperclip"></i>${atts}</span>
                    </div>
                    <div class="k-meta">
                        <div class="k-due ${dueClass}"><i class="fas fa-calendar-alt"></i> ${dueText}</div>
                        <div class="k-assignees">
                            ${(t.assigned_to||[]).slice(0,3).map(uid=>`<div class="k-avatar" title="User">U</div>`).join('')}
                            ${(t.assigned_to||[]).length>3?`<div class="k-avatar" style="background:#475569">+${t.assigned_to.length-3}</div>`:''}
                        </div>
                    </div>
                </div>`;
            }).join('');
        });
    }

    async function loadTasks() {
        const r = await api('/api/tasks/');
        const data = await r.json();
        renderCards(data.tasks||[]);
    }

    async function updateTaskStatus(taskId, newStatus) {
        const r = await api(`/api/tasks/${taskId}/status`,'POST',{status:newStatus});
        if(r.ok){
            showToast('Task moved successfully','success');
            // update counts
            ['assigned','in_progress','under_review','approved'].forEach(s=>{
                document.getElementById(`count-${s}`).textContent = document.getElementById(`col-${s}`).children.length;
            });
        }else{
            showToast('Failed to move task','error');
            loadTasks(); // revert UI
        }
    }

    function initDragAndDrop() {
        drake = dragula([
            document.getElementById('col-assigned'),
            document.getElementById('col-in_progress'),
            document.getElementById('col-under_review'),
            document.getElementById('col-approved')
        ]);
        
        drake.on('drop', (el, target, source) => {
            if(target === source) return;
            const taskId = el.getAttribute('data-id');
            const newStatus = target.getAttribute('data-status');
            updateTaskStatus(taskId, newStatus);
        });
    }

    // Socket
    const socket = io({auth:{token}});
    socket.on('task_created', loadTasks);
    socket.on('task_updated', loadTasks);

    initDragAndDrop();
    loadTasks();
</script>
</body>
</html>
