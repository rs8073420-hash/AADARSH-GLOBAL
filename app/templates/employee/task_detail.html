<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Task Detail — Employee Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#3b82f6;--accent:#06b6d4;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--card:#1e293b;--card2:#0f172a;--border:rgba(59,130,246,0.15);--muted:#94a3b8;--bg:#020617}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:#f1f5f9;display:flex;min-height:100vh}
        
        .sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100}
        .sidebar-brand{padding:22px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
        .logo{width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
        .brand-name{font-size:15px;font-weight:700;color:#fff}.brand-sub{font-size:11px;color:var(--muted)}
        .sidebar-nav{flex:1;padding:16px 12px;overflow-y:auto}
        .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:all .2s;margin-bottom:2px}
        .nav-item:hover,.nav-item.active{background:rgba(59,130,246,.15);color:var(--primary)}
        .sidebar-footer{padding:16px 12px}
        .user-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
        .logout-btn{width:100%;padding:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;color:#ef4444;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
        
        .main{margin-left:260px;flex:1;min-height:100vh}
        .topbar{position:sticky;top:0;background:rgba(2,6,23,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;z-index:90}
        .back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:500;text-decoration:none;transition:all .2s}
        .back-btn:hover{color:var(--primary);border-color:var(--primary)}
        .topbar-title{font-size:17px;font-weight:700;color:#fff;flex:1}
        
        .content{padding:28px}
        .detail-grid{display:grid;grid-template-columns:1fr 380px;gap:22px}
        .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:20px}
        .card-title{font-size:14px;font-weight:700;color:#fff;margin-bottom:18px;display:flex;align-items:center;gap:8px}
        .card-title i{color:var(--primary)}
        
        .task-main-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:12px;line-height:1.3}
        .task-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:18px}
        
        .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
        .badge-assigned{background:rgba(99,102,241,.15);color:#6366f1}
        .badge-in_progress{background:rgba(59,130,246,.15);color:#3b82f6}
        .badge-under_review{background:rgba(249,115,22,.15);color:#f97316}
        .badge-approved{background:rgba(16,185,129,.15);color:#10b981}
        .badge-rejected{background:rgba(239,68,68,.15);color:#ef4444}
        .badge-completed{background:rgba(20,184,166,.15);color:#14b8a6}
        .badge-high{background:rgba(239,68,68,.15);color:#ef4444}
        .badge-medium{background:rgba(245,158,11,.15);color:#f59e0b}
        .badge-low{background:rgba(16,185,129,.15);color:#10b981}
        
        /* Comments */
        .comment-list{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;max-height:350px;overflow-y:auto}
        .comment{display:flex;gap:12px}
        .comment-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
        .comment-avatar.admin{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
        .comment-avatar.employee{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
        .comment-body{flex:1}
        .comment-meta{display:flex;align-items:center;gap:8px;margin-bottom:5px}
        .comment-name{font-size:13px;font-weight:600;color:#fff}
        .comment-role{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
        .comment-role.admin{background:rgba(99,102,241,.2);color:#6366f1}
        .comment-role.employee{background:rgba(59,130,246,.2);color:#3b82f6}
        .comment-time{font-size:11px;color:var(--muted)}
        .comment-text{font-size:13px;color:#cbd5e1;line-height:1.5;background:var(--card2);padding:10px 14px;border-radius:0 10px 10px 10px;border-left:3px solid var(--border)}
        
        .comment-form{display:flex;gap:10px;align-items:flex-end}
        .comment-input{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:13px;font-family:'Inter',sans-serif;resize:none;outline:none;min-height:70px}
        .comment-input:focus{border-color:var(--primary)}
        
        .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;color:#fff;font-family:'Inter',sans-serif}
        .btn-primary{background:var(--primary)}.btn-primary:hover{opacity:.9}
        .btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}.btn-outline:hover{background:rgba(59,130,246,.1)}
        .btn-sm{padding:7px 14px;font-size:12px}
        
        /* Action card */
        .form-control{width:100%;padding:9px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:#f1f5f9;font-size:13px;outline:none;margin-bottom:10px}
        
        /* Attachments */
        .attachment-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
        .attach-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:rgba(59,130,246,.15);color:var(--primary)}
        .attach-name{font-size:13px;font-weight:500;flex:1}
        .attach-download{width:30px;height:30px;border-radius:7px;background:rgba(59,130,246,.1);color:var(--primary);display:flex;align-items:center;justify-content:center;text-decoration:none}
        .attach-download:hover{background:var(--primary);color:#fff}
        
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
        .modal-overlay.active{display:flex}
        .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:440px}
        
        /* Toast */
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
        .toast{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
        .toast.success{border-left:4px solid var(--success)}
        .toast.error{border-left:4px solid var(--danger)}
    </style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<!-- Upload Modal -->
<div class="modal-overlay" id="uploadModal">
    <div class="modal">
        <h3 style="margin-bottom:16px">Upload Attachment</h3>
        <div style="border:2px dashed var(--border);padding:24px;text-align:center;border-radius:10px;cursor:pointer" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size:32px;color:var(--primary);margin-bottom:10px"></i>
            <p>Click to select file</p>
            <p id="selectedFileName" style="color:var(--primary);font-size:12px;margin-top:8px"></p>
        </div>
        <input type="file" id="fileInput" style="display:none" onchange="onFileSelect()">
        <div style="display:flex;gap:10px;margin-top:16px">
            <button class="btn btn-outline" style="flex:1;justify-content:center" onclick="closeUpload()">Cancel</button>
            <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="doUpload()">Upload</button>
        </div>
    </div>
</div>

<nav class="sidebar">
    <div class="sidebar-brand"><div class="logo">A</div><div><div class="brand-name">Aadarsh Global</div><div class="brand-sub">Employee Portal</div></div></div>
    <div class="sidebar-nav">
        <a href="/employee/dashboard" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
        <a href="/employee/tasks" class="nav-item active"><i class="fas fa-tasks"></i> My Tasks</a>
        <a href="/employee/leads" class="nav-item"><i class="fas fa-funnel-dollar"></i> My Leads</a>
        <a href="/employee/attendance" class="nav-item"><i class="fas fa-clock"></i> Attendance</a>
        <a href="/employee/calendar" class="nav-item"><i class="fas fa-calendar-alt"></i> Calendar</a>
        <a href="/employee/notes" class="nav-item"><i class="fas fa-sticky-note"></i> Sticky Notes</a>
        <a href="/employee/messages" class="nav-item"><i class="fas fa-envelope"></i> Messages</a>
        
        <div style="font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-top: 15px; margin-bottom: 5px; padding-left: 12px;">Account</div>
        <a href="/employee/profile" class="nav-item"><i class="fas fa-user"></i> My Profile</a>
        <a href="/employee/notifications" class="nav-item" style="justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;"><i class="fas fa-bell"></i> Notifications</div>
            <span class="global-bell-badge-sync bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
        </a>
    </div>
    <div class="sidebar-footer">
        <div class="user-card">
            <div class="avatar" id="sidebarAvatar">E</div>
            <div style="min-width: 0; flex: 1;">
                <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sidebarName">Employee</div>
                <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sidebarRole">Employee</div>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
</nav>

<div class="main">
    <div class="topbar">
        <a href="/employee/tasks" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="topbar-title" id="topbarTitle">Task Detail</div>
        <div id="topbarStatus"><span id="task-status"></span></div>
    </div>
    <div class="content">
        <div class="detail-grid">
            <!-- LEFT -->
            <div>
                <div class="card">
                    <div class="task-main-title" id="taskTitle">Loading...</div>
                    <div style="display:flex;gap:10px;margin-bottom:16px" id="taskMeta"></div>
                    <div class="task-desc" id="taskDesc"></div>
                    
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--card2);padding:14px;border-radius:10px;border:1px solid var(--border)">
                        <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Due Date</div><div style="font-size:13px" id="taskDue"></div></div>
                        <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase">Assigned By</div><div style="font-size:13px" id="taskAssignedBy"></div></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fas fa-comments"></i> Comments</div>
                    <div class="comment-list" id="commentList"></div>
                    <div class="comment-form">
                        <textarea class="comment-input" id="commentText" placeholder="Write a comment or update..."></textarea>
                        <button class="btn btn-primary btn-sm" onclick="postComment()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- RIGHT -->
            <div>
                <div class="card">
                    <div class="card-title"><i class="fas fa-sync"></i> Update Status</div>
                    <select class="form-control" id="statusSelect">
                        <option value="in_progress">⚡ In Progress</option>
                        <option value="under_review">👁 Submit for Review</option>
                        <option value="completed">🏆 Completed (Requires Admin Approval)</option>
                    </select>
                    <input type="text" class="form-control" id="statusNote" placeholder="Add a note (optional)">
                    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="applyStatus()"><i class="fas fa-check"></i> Update Status</button>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fas fa-paperclip"></i> Attachments <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="openUpload()"><i class="fas fa-upload"></i></button></div>
                    <div id="attachmentList"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('access_token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if(!token) window.location.href = '/login';
    document.getElementById('sidebarName').textContent = user.name || 'Employee';
    document.getElementById('sidebarAvatar').textContent = (user.name||'E').charAt(0).toUpperCase();
    document.getElementById('sidebarRole').textContent = user.department || 'Staff';
    const TASK_ID = '{{ task_id }}';
    
    function showToast(msg, type='info') {
        const c=document.getElementById('toastContainer');const t=document.createElement('div');
        t.className=`toast ${type}`;
        t.innerHTML=`<i class="fas ${type==='success'?'fa-check-circle':'fa-times-circle'}" style="color:var(--${type});font-size:18px"></i><span style="font-size:13px">${msg}</span>`;
        c.appendChild(t);setTimeout(()=>t.remove(),3500);
    }
    function logout(){localStorage.clear();window.location.href='/login';}
    
    async function api(url,method='GET',body=null,isForm=false){
        const opts={method,headers:{'Authorization':'Bearer '+token}};
        if(!isForm) opts.headers['Content-Type']='application/json';
        if(body) opts.body = isForm ? body : JSON.stringify(body);
        return fetch(url,opts);
    }

    async function loadTask() {
        const r = await api(`/api/tasks/${TASK_ID}`);
        if(!r.ok) return showToast('Error loading task','error');
        const t = await r.json();
        
        document.getElementById('task-status').innerHTML = `<span class="badge badge-${t.status}">${(t.status || 'pending').replace('_', ' ').toUpperCase()}</span>`;
        document.getElementById('taskTitle').textContent = t.title;
        document.getElementById('taskDesc').textContent = t.description;
        document.getElementById('taskMeta').innerHTML = `
            <span class="badge badge-${t.priority||'medium'}"><i class="fas fa-flag"></i> ${(t.priority||'medium').toUpperCase()}</span>
            <span class="badge" style="background:var(--card2);color:var(--muted)">${t.task_id}</span>`;
        
        document.getElementById('taskDue').textContent = t.due_date || 'No due date';
        document.getElementById('taskAssignedBy').textContent = t.assigned_by_name || 'Admin';
        
        // update select
        const s = document.getElementById('statusSelect');
        if([...s.options].some(o=>o.value===t.status)) s.value = t.status;
        
        // render comments
        const clist = document.getElementById('commentList');
        if(!t.comments || !t.comments.length) {
            clist.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)"><i class="fas fa-comment-slash" style="font-size:24px;margin-bottom:10px;display:block"></i>No comments yet</div>';
        } else {
            clist.innerHTML = t.comments.map(c=>`
                <div class="comment">
                    <div class="comment-avatar ${c.author_role==='admin'?'admin':'employee'}">${(c.author_name||'?')[0].toUpperCase()}</div>
                    <div class="comment-body">
                        <div class="comment-meta">
                            <span class="comment-name">${c.author_name}</span>
                            <span class="comment-role ${c.author_role==='admin'?'admin':'employee'}">${c.author_role}</span>
                        </div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                </div>`).join('');
            clist.scrollTop = clist.scrollHeight;
        }
        
        // attachments
        const alist = document.getElementById('attachmentList');
        if(!t.attachments || !t.attachments.length) {
            alist.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">No attachments</div>';
        } else {
            alist.innerHTML = t.attachments.map(a=>`
                <div class="attachment-item">
                    <div class="attach-icon"><i class="fas fa-file"></i></div>
                    <div class="attach-name">${a.original_name||'File'}</div>
                    <a href="${a.url}" target="_blank" class="attach-download"><i class="fas fa-download"></i></a>
                </div>`).join('');
        }
    }

    async function applyStatus() {
        const status = document.getElementById('statusSelect').value;
        const note = document.getElementById('statusNote').value.trim();
        const r = await api(`/api/tasks/${TASK_ID}/status`,'POST',{status,note});
        if(r.ok){
            showToast('Status updated','success');
            document.getElementById('statusNote').value='';
            loadTask();
        } else showToast('Failed to update','error');
    }

    async function postComment() {
        const text = document.getElementById('commentText').value.trim();
        if(!text) return;
        const r = await api(`/api/tasks/${TASK_ID}/comment`,'POST',{text});
        if(r.ok){
            document.getElementById('commentText').value='';
            loadTask();
        }
    }

    function openUpload(){document.getElementById('uploadModal').classList.add('active');}
    function closeUpload(){document.getElementById('uploadModal').classList.remove('active');document.getElementById('fileInput').value='';}
    function onFileSelect(){
        const f=document.getElementById('fileInput').files[0];
        if(f) document.getElementById('selectedFileName').textContent=f.name;
    }
    async function doUpload(){
        const f=document.getElementById('fileInput').files[0];
        if(!f){showToast('Select a file','error');return;}
        const form=new FormData();form.append('file',f);
        const r=await api(`/api/tasks/${TASK_ID}/attach`,'POST',form,true);
        if(r.ok){showToast('Uploaded','success');closeUpload();loadTask();}
        else showToast('Upload failed','error');
    }

    const socket = io({auth:{token}});
    socket.on('connect',()=>{socket.emit('join_task_room',{task_id:TASK_ID});});
    socket.on('new_comment',loadTask);
    socket.on('task_status_changed',loadTask);
    socket.on('file_uploaded',loadTask);

    loadTask();
</script>
</body>
</html>
